[project]
name = "ref-mm"
version = "0.0.1"
description = "Kalshi maker strategy priced off Polymarket Global fair value (research + paper + gated live)."
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
    "httpx>=0.27",
    "websockets>=13",
    "pyarrow>=17",
    "polars>=1.9",
    "duckdb>=1.1",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "numpy>=2.0",
    "anthropic>=0.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "hypothesis>=6.110",
    "mypy>=1.11",
    "ruff>=0.6",
    "pre-commit>=3.8",
]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pmcore*", "strategies*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["pmcore"]

[[tool.mypy.overrides]]
module = ["duckdb", "duckdb.*", "pyarrow", "pyarrow.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
